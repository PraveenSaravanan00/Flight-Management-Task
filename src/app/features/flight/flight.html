<div class="map-wrapper">
  <div #mapContainer class="map-container" id="main-leaflet-map"></div>

  <div class="map-legend">
    <div class="legend-title">
      <i class="pi pi-info-circle"></i> Legend
    </div>
    <div class="legend-items">
      <div class="legend-item"><span class="legend-dot" style="background:#22c55e"></span>Active</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Delayed</div>
      <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span>Arrived</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ef4444"></span>Cancelled</div>
      <div class="legend-item"><span class="legend-dot" style="background:#a855f7"></span>Boarding</div>
    </div>
  </div>
</div>
